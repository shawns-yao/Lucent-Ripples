<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#507e70"/><title>一池清漾 · PixiJS Pond</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/></head>
<body><main id="pond" aria-label="交互式鱼池，点击水面吸引附近的鱼"><div id="loading"><span></span><p>一池清漾</p></div></main><aside id="hint" aria-live="polite"><i></i><span>轻点水面，等鱼儿游来</span></aside><details id="weather-panel"><summary id="weather-summary">晴 · 演示</summary><div class="weather-content"><h1>一池清漾</h1><p class="eyebrow">让一池水，随天气呼吸</p><div class="weather-options" aria-label="演示天气"><button data-weather="clear" aria-pressed="true">晴</button><button data-weather="cloudy" aria-pressed="false">阴</button><button data-weather="rain" aria-pressed="false">雨</button><button data-weather="snow" aria-pressed="false">雪</button><button data-weather="wind" aria-pressed="false">风</button></div><div class="time-options" aria-label="昼夜模式"><button data-time="auto" aria-pressed="true">自动昼夜</button><button data-time="day" aria-pressed="false">白昼预览</button><button data-time="night" aria-pressed="false">月夜预览</button></div><p class="small-note" id="celestial-note">自动昼夜与月位按真实时间计算；未选地点时以北京为参考。月夜/白昼为示意预览。</p><p id="weather-status" role="status">演示天气 · 未获取位置或真实天气</p><section class="local-weather"><p>点击后请求一次定位。约 1 公里精度的位置会发送给本应用天气服务及和风天气，仅用于查询天气；不记录位置历史。也可手动填写城市和区县，所填地名会发送给和风天气用于查询</p><button id="local-weather" class="wide">使用当地天气</button><form id="city-form"><label for="city-name">城市<input id="city-name" name="city" placeholder="北京市 / 北京市朝阳区" maxlength="80" autocomplete="off" required></label><label for="district-name">区 / 县（可选）<input id="district-name" name="district" placeholder="朝阳区" maxlength="80" autocomplete="off"></label><button type="submit">查找</button></form><div id="city-results" aria-label="城市搜索结果"></div></section><section class="growth-controls"><p id="growth-note">荷花在随机水域自然生长，进度保存在此浏览器。幼叶约 1 天、展叶 3 天、花苞 7 天、半开 10 天、盛开 12 天；关闭页面也继续计时。</p></section><div id="weather-credit" hidden></div></div></details><div class="controls"><button id="pause" aria-label="暂停动画" title="暂停 · 空格键"><svg viewBox="0 0 20 20"><path d="M7 5v10M13 5v10"/></svg></button><button id="fullscreen" aria-label="全屏" title="全屏 · F"><svg viewBox="0 0 20 20"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button></div><script type="module" src="/src/main.js"></script></body></html>
